--gold:#e8b923;--bg:#120b06;--card:rgba(30,20,12,.84);--text:#f6ecd9;--muted:#c4b393;--accent:#e8b923;--accent-t:#1a1005;
--ok:#8ee0a0;--okbg:rgba(46,100,60,.5);--bad:#ff9a90;--badbg:rgba(120,36,32,.5);--line:rgba(232,185,35,.3);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--img2) center/cover no-repeat;filter:brightness(.42)}
body[data-step="grade"]::before{filter:brightness(.6)}
main{max-width:600px;margin:0 auto;padding:16px 16px 12px}
h1{font-family:'Playfair Display',Georgia,serif;font-size:1.45rem;color:var(--gold);margin:8px 0 4px;letter-spacing:.3px}
p.sub{color:var(--muted);margin:0 0 18px}
.hero{aspect-ratio:16/9;width:100%;border-radius:18px;background:var(--img) center/cover no-repeat;border:1px solid var(--gold);box-shadow:0 12px 34px rgba(0,0,0,.55),0 0 0 4px rgba(232,185,35,.12)}
.orn{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--gold)}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.orn b{font-size:.8rem}
.mini{font-family:'Playfair Display',Georgia,serif;color:var(--gold);font-size:.95rem;letter-spacing:1px;text-align:center;padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.crumb{font-size:.85rem;color:var(--muted);margin-bottom:10px}
.back{background:none;border:0;color:var(--gold);font-size:.95rem;padding:6px 0;cursor:pointer}
.grid{display:grid;gap:10px}.grid.two{grid-template-columns:1fr 1fr}
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:1rem;text-align:left;cursor:pointer;width:100%;backdrop-filter:blur(4px);transition:border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:scale(.98);box-shadow:0 0 0 1px var(--gold)}
.btn b{display:block;font-size:1.05rem}.btn small{color:var(--muted)}
.primary{background:linear-gradient(180deg,#f3cc4c,#d9a514);color:var(--accent-t);border:0;text-align:center;font-weight:700}
.bar{height:6px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b8891a,#f3cc4c);transition:width .3s}
.q{font-size:1.1rem;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;font-size:1rem;cursor:pointer;backdrop-filter:blur(4px)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;opacity:1}
.exp{background:var(--card);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;margin:6px 0 14px;font-size:.95rem}
.score{font-family:'Playfair Display',Georgia,serif;font-size:3rem;font-weight:700;text-align:center;margin:10px 0 0;color:var(--gold)}
.center{text-align:center;color:var(--muted)}
.rev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;font-size:.95rem}
.rev .t{font-weight:600}.tag{font-size:.8rem;font-weight:600}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
.timer{font-weight:700;color:var(--gold)}
.foot{text-align:center;color:var(--gold);font-family:'Playfair Display',Georgia,serif;font-style:italic;letter-spacing:2px;font-size:.85rem;padding:14px 0 24px;opacity:.85}
</style>

<body>
<main id="app"></main>
<div class="foot">Read ◆ Learn ◆ Grow</div>
<script>
/* ===== QUESTION BANK =====
Add content here. Structure: grade -> (stream, only grades 11-12) -> subject -> unit -> questions.
A question is { q: "text", o: ["A","B","C","D"], a: index of correct option, e: "explanation" } */
const Q = r => r.map(([q,o,a,e]) => ({q,o,a,e}));
/* ===== PRACTICE QUESTION GENERATORS (fresh numbers every attempt) ===== */
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pk=a=>a[ri(0,a.length-1)];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fr=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return d==1?''+n:n+'/'+d};
const nr=n=>[n+1,n-1,n+2,n-2,-n,n+3];
const mk=(q,ans,wrong,e)=>{const w=[...new Set(wrong.map(String))].filter(x=>x!==String(ans));const nm=+ans;if(!isNaN(nm))for(let k=1;w.length<3&&k<30;k++)for(const c of [nm+k,nm-k])if(w.length<3&&!w.includes(String(c))&&String(c)!==String(ans))w.push(String(c));const o=sh([String(ans),...w.slice(0,3)]);return {q,o,a:o.indexOf(String(ans)),e}};
const lin=(a,b)=>`${a==1?'':a}x ${b<0?'−':'+'} ${Math.abs(b)}`;
const lin2=(a,b)=>`${a}x ${b<0?'−':'+'} ${Math.abs(b)}y`;
const ms=m=>'['+m.map(r=>'['+r.join(', ')+']').join(', ')+']';
const M=(n,lo=-4,hi=6)=>Array.from({length:n},()=>Array.from({length:n},()=>ri(lo,hi)));
const fact=n=>n<2?1:n*fact(n-1), nP=(n,r)=>fact(n)/fact(n-r), nC=(n,r)=>nP(n,r)/fact(r);
const sgn=v=>v<0?'−1':''+v;
const vs=v=>'('+v.join(', ')+')';
const V=()=>[ri(-5,6),ri(-5,6),ri(-5,6)];
const P2=()=>{let x,y;do{x=ri(-6,6);y=ri(-6,6)}while(!x||!y||x==y||x==-y);return[x,y]};
const ps=p=>`(${p[0]}, ${p[1]})`;
const sup=n=>({2:'²',3:'³'}[n]);
const GEN={};

GEN['Unit 1: Relations and Functions']=[
()=>{const a=ri(2,5),b=ri(-6,6)||1,c=ri(-4,5),v=a*c+b;return mk(`If f(x) = ${lin(a,b)}, what is f(${c})?`,v,nr(v),`Substitute x = ${c}: the result is ${v}.`)},
()=>{const a=ri(2,4),b=ri(1,5),d=ri(1,6),c=ri(1,4),g=c*c+d,v=a*g+b;return mk(`If f(x) = ${lin(a,b)} and g(x) = x² + ${d}, what is (f∘g)(${c})?`,v,[(a*c+b)**2+d,a*c+b+d,a*g,v+a],`g(${c}) = ${g}, then f(${g}) = ${v}.`)},
()=>{const a=ri(2,5),b=ri(1,8),k=ri(1,6),c=a*k+b;return mk(`If f(x) = ${lin(a,b)}, what is f⁻¹(${c})?`,k,nr(k),`Solve ${lin(a,b)} = ${c}, which gives x = ${k}.`)},
()=>{const a=ri(2,4),b=ri(-5,5),x=ri(-5,5),i=a*x+b,v=Math.abs(i);return mk(`If f(x) = |${lin(a,b)}|, what is f(${x})?`,v,nr(v).concat([i]),`The expression inside is ${i}, and its absolute value is ${v}.`)},
()=>{const x=ri(-9,9)+pk([.2,.5,.7]),v=Math.floor(x);return mk(`What is the greatest integer (floor) of ${x}?`,v,[v+1,v-1,Math.round(x)],`The floor is the greatest integer not larger than ${x}, which is ${v}.`)},
()=>{const a=ri(-9,9),b=ri(-9,9),v=Math.sign(a-b);return mk(`What is sgn(${a} − ${b})?`,sgn(v),['−1','0','1','2'],`${a} − ${b} = ${a-b}, so the signum is ${sgn(v)}.`)},
()=>{const m=ri(2,6),n=ri(2,6);return mk(`Set A has ${m} elements and set B has ${n} elements. How many ordered pairs are in A × B?`,m*n,[m+n,m*n-1,m*n+n,m*m],`|A × B| = ${m} × ${n} = ${m*n}.`)},
()=>{const r=pk([2,3]),x=ri(2,9),v=x**r;return mk(`If f(x) = x${sup(r)}, what is f(${x})?`,v,nr(v).concat([x*r]),`${x}${sup(r)} = ${v}.`)}
];

GEN['Unit 2: Rational Expressions and Rational Functions']=[

()=>{const L=ri(5,20)*10,p=ri(10,25),cst=ri(1,L*p/2-1),v=L*p-cst;return mk(`A dairy sells ${L} litres of milk at Br ${p} per litre. Its costs are Br ${cst}. What is the profit (in Br)?`,v,nr(v).concat([L*p]),`Revenue = ${L*p}; profit = ${L*p} − ${cst} = ${v}.`)});
GEN[AGN[14]].push(()=>{const h=pk([1.5,1.6,1.7,1.8]),w=ri(45,95),b=w/(h*h),c=bmiC(b);return mk(`A person is ${h} m tall and weighs ${w} kg (BMI ≈ ${d2(b)}). How is this classified? (below 18.5 thin, 18.5–25 normal, 25–30 overweight, over 30 obese)`,c,['Thin (underweight)','Normal','Overweight','Obese'],`BMI = ${w} ÷ ${h}² = ${d2(b)}, so ${c.toLowerCase()}.`)});

const AGQ={
 [AGN[0]]:Q([['Which of the following crops is a C4 plant?',['Maize','Wheat','Barley','Teff only'],0,'Maize and sorghum are C4 plants that accumulate CO₂ in the chloroplast.'],['Growing different crops in a planned sequence on the same land is…',['Crop rotation','Mono cropping','Relay planting','Mixed cropping'],0,'Rotation helps soil fertility and reduces pests.'],['Low crop yields in Ethiopia are mainly attributed to…',['Soil degradation, erosion, compaction, climate change and low irrigation','Too much machinery','Too many roads','Too much rain only'],0,'These are the main factors named in the unit.']]),
 [AGN[1]]:Q([['Which cereal is best adapted to lowland and moisture-deficit areas?',['Sorghum','Wheat','Barley','Faba bean'],0,'Wheat and barley suit the highlands.'],['Legumes improve soil by…',['Fixing atmospheric nitrogen','Removing nitrogen','Adding sand','Reducing organic matter'],0,'Cereal–legume integration improves nitrogen for cereals.'],['Cereals are…',['Monocots rich in carbohydrates','Dicots rich in oil','Fungi','Trees'],0,'Teff, maize, wheat, barley and sorghum are cereals.']]),
 [AGN[2]]:Q([['Which crop produces hard fiber used for carpets, sacks and ropes?',['Sisal','Cotton','Sesame','Noug'],0,'Cotton is a soft fiber.'],['Which oil crops are used for food oil, paints and soaps?',['Noug and sesame','Cotton and sisal','Maize and wheat','Sugar cane only'],0,'Their residues are used as animal feed.'],['Sugar cane takes about how long to mature?',['14 to 18 months','2 to 3 months','4 to 6 months','5 years'],0,'It needs long warm seasons.']]),
 [AGN[3]]:Q([['Which is not a component of the monogastric digestive system?',['Rumen','Mouth','Esophagus','Large intestine'],0,'Ruminants have a rumen; monogastric animals have a single stomach.'],['Which of these is an omnivorous animal?',['Chicken','Cattle','Sheep','Horse'],0,'Omnivores eat both plants and animals.'],['The traditional, subsistence production system is the…',['Extensive system','Intensive system','Semi-intensive system','Feedlot system'],0,'The intensive system is modern and market-oriented.']]),
 [AGN[4]]:Q([['What is the most common feed resource in Ethiopia?',['Natural pasture','Crop residue','Improved forages','Agro-industrial by-products'],0,'Natural pasture is the main feed resource.'],['Feeds are classified into…',['Roughages and concentrates','Grains and fruits','Wet and dry only','Local and imported only'],0,'The classification is by nutritive value.'],['Which method balances animal diets?',['The Pearson Square','The quadrat method','Mark-recapture','Crop rotation'],0,'It finds the proportions of two feeds for a target protein level.']]),
 [AGN[5]]:Q([['The mating of proven quality animals from different breeds is called…',['Cross breeding','Inbreeding','Line breeding','Outbreeding only'],0,'Cross breeding exploits hybrid vigour (heterosis).'],['Which is a temporary method of animal identification?',['Tail marking','Branding','Tattooing','Ear notching'],0,'The others are permanent.'],['Artificial insemination aims to exploit…',['Superior males','Superior females','Weak animals','Feed only'],0,'Embryo transfer exploits superior females.']]),
 [AGN[6]]:Q([['The floor of an animal house should be made of…',['Concrete with proper gradient for drainage','Soft soil','Wood only','Sand'],0,'Concrete with a gradient drains and cleans easily.'],['Which is a site selection factor?',['Drainage','Color of the house','Price of the animals','Number of visitors'],0,'Others are topography, accessibility, distance from residences and services.'],['The roof of an animal house should be…',['High enough to release heat, moisture and pollutants','As low as possible','Made of glass only','Absent'],0,'This keeps the air fresh.']]),
 [AGN[7]]:Q([['Which is an external parasite?',['Tick','Tapeworm','Liver fluke','Roundworm'],0,'Ticks, mites, flies and lice are external parasites.'],['Which disease is spread by contact and is a major disease of farm animals in Ethiopia?',['Foot and mouth disease','Common cold','Chicken pox','Measles'],0,'Others include anthrax, brucellosis and Newcastle disease.'],['A zoonotic disease is one that…',['Can pass from animals to humans','Affects only plants','Affects only wild animals','Cannot be treated'],0,'Examples include anthrax and brucellosis.']]),
 [AGN[8]]:Q([['Dairy-type cattle have a body shape that is…',['Triangular (wedge-shaped)','Rectangular','Round','Cylindrical only'],0,'They also have a well-developed mammary system.'],['Which is a product of milk processing?',['Butter','Flour','Honey','Oil'],0,'Others are cheese, yoghurt, cream and ghee.'],['Dairy cattle housing must provide…',['A comfortable, well-drained and dry lying area','A wet floor','No shade','A closed room with no air'],0,'Sanitation and manure management are essential.']]),
 [AGN[9]]:Q([['Natural resources are…',['Materials, creatures or energy not produced but used by humans','Only factory goods','Only minerals','Only forests'],0,'Examples are soil, water, forests, wildlife and minerals.'],['Soil degradation…',['Reduces the soil’s capacity to produce crops','Increases harvests','Cleans water','Adds nutrients'],0,'It makes food security difficult.'],['Ethiopia’s water resources give opportunity for…',['Irrigated agriculture and hydropower','Only fishing','Only tourism','Nothing'],0,'Surface and ground water are both important.']]),
 [AGN[10]]:Q([['Which is an agronomic soil management practice?',['Mulching','Overgrazing','Burning stubble all the time','Clear felling'],0,'Others include contour farming, crop rotation and adding organic matter.'],['Wildlife management mainly aims to…',['Protect natural habitats from destruction','Hunt animals','Clear forests','Sell wild animals'],0,'It reduces human encroachment.'],['Forest management practices should ensure…',['A sustainable supply of firewood and conserve biodiversity','Faster deforestation','No trees','Only timber sales'],0,'They also store carbon and reduce desertification risk.']]),
 [AGN[11]]:Q([['Which is a threat to biodiversity?',['Habitat destruction','Conservation','Protected areas','Gene banks'],0,'Others: overexploitation, invasive species, climate change, pollution and population growth.'],['Biodiversity includes…',['Genetic, species and habitat diversity','Only plants','Only animals','Only microbes'],0,'It covers all life forms and their habitats.'],['Biodiversity conservation is important because…',['It protects the values and services biodiversity provides','It stops all farming','It removes forests','It reduces rainfall'],0,'Biodiversity supports food, medicine and ecosystems.']]),
 [AGN[12]]:Q([['The major causes of climate change are mainly…',['Human activities such as fossil fuel burning and land-use change','Volcanoes only','Tides','Moonlight'],0,'Agriculture also contributes.'],['The triple objectives of Climate Smart Agriculture include…',['Increasing production, enhancing adaptation and reducing emissions','Increasing emissions','Reducing yields','Removing farmers'],0,'These address food security and climate change.'],['Which is an adaptation practice?',['Changing crop varieties','Burning more fossil fuel','Cutting forests','Overgrazing'],0,'Other examples are crop diversification and income diversification.']]),
 [AGN[13]]:Q([['Mechanization is…',['The use of machines in farm work','Hand weeding only','Animal feeding','Rain-fed farming'],0,'It boosts agricultural and food production.'],['The three levels of mechanization are…',['Low, fair and high','Small, big and giant','Hand, animal and tractor only','Rural, urban and mixed'],0,'The level depends on the area.'],['The main power sources used in farming are…',['Human, animal and mechanical','Solar only','Wind only','Wood only'],0,'Different tools serve each stage of production.']]),
 [AGN[14]]:Q([['The six major classes of nutrients are…',['Carbohydrates, fats, proteins, minerals, vitamins and water','Sugar, salt, oil, rice, fish and meat','Iron, zinc, iodine, calcium, sodium and potassium','Cereals, pulses, fruits, nuts, roots and tubers'],0,'All are essential for the body.'],['The recommended energy share of carbohydrates, fats and proteins is…',['55%, 30% and 15%','15%, 30% and 55%','33%, 33% and 34%','70%, 20% and 10%'],0,'This applies to a healthy diet.'],['The four pillars of food security are…',['Availability, access, utilization and stability','Land, labor, capital and seed','Rain, soil, seed and sun','Price, quality, color and size'],0,'Food security means availability and accessibility at all times.']]),
 [AGN[15]]:Q([['The primary focus of diversified food production is to…',['Improve dietary diversity and nutrition outcomes','Reduce crop variety','Increase one crop only','Avoid animals'],0,'A diverse diet best ensures nutrient adequacy.'],['Which is a nutrient enrichment or modification strategy?',['Fortification','Burning','Overgrazing','Mono cropping'],0,'Others are fermentation, germination and roasting.'],['Dietary modifications aim to…',['Reduce micronutrient deficiencies','Increase deficiencies','Remove all fats','Stop eating vegetables'],0,'They raise the nutritive value and bioavailability of foods.']])
};
BANK[11].streams['Natural Science'].subjects['Agriculture']=AGQ;

BANK[11].streams["Social Science"].subjects["Mathematics"] = BANK[11].streams["Natural Science"].subjects["Mathematics"];
const app = document.getElementById("app");
const S = {step:"grade", grade:null, stream:null, subject:null, unit:null, qs:[], i:0, picked:null, answers:[]};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const node = () => { const g = BANK[S.grade]; return g.streams ? (S.stream ? g.streams[S.stream] : null) : g; };
const crumb = () => ["Grade " + S.grade, S.stream, S.subject].filter(Boolean).join(" › ");

function go(step, patch){ Object.assign(S, patch||{}, {step}); render(); window.scrollTo(0,0); }
function back(){
  const g = BANK[S.grade];
  const prev = {stream:"grade", subject: g && g.streams ? "stream" : "grade", unit:"subject", quiz:"unit", result:"unit"};
  go(prev[S.step]);
}
const backBtn = () => '<button class="back" onclick="back()">← Back</button>';
const pick = (label, sub, fn) => `<button class="btn" onclick="${fn}"><b>${esc(label)}</b>${sub?`<small>${esc(sub)}</small>`:""}</button>`;

function render(){
  let h = "";
  if (S.step === "grade"){
    h = `<div class="hero" role="img" aria-label="House of Wisdom, Read, Learn, Grow"></div><div class="orn"><i></i><b>◆</b><i></i></div><p class="sub center">Choose your grade to begin</p><div class="grid">` +
      Object.keys(BANK).map(g => pick("Grade " + g, "", `chooseGrade(${g})`)).join("") + `</div>`;
  } else if (S.step === "stream"){
    h = backBtn() + `<div class="crumb">${crumb()}</div><h1>Choose your department</h1><div class="grid">` +
      Object.keys(BANK[S.grade].streams).map((s,i) => pick(s, "", `chooseStream(${i})`)).join("") + `</div>`;
  } else if (S.step === "subject"){
    const subs = Object.keys(node().subjects);
    h = backBtn() + `<div class="crumb">${esc(crumb())}</div><h1>Choose a subject</h1><div class="grid">` +
      subs.map((s,i) => pick(s, Object.keys(node().subjects[s]).length + " unit(s)", `chooseSubject(${i})`)).join("") + `</div>`;
  } else if (S.step === "unit"){
    const units = node().subjects[S.subject];
    h = backBtn() + `<div class="crumb">${esc(crumb())}</div><h1>Choose a unit</h1><div class="grid">` +
      Object.keys(units).map((u,i) => pick(u, (GEN[u]?50:units[u].length) + " questions", `startQuiz(${i})`)).join("") + `</div>`;
  } else if (S.step === "quiz"){
    const q = S.qs[S.i], done = S.picked !== null, n = S.qs.length;
    h = backBtn() + `<div class="crumb">${esc(S.unit)}</div><div class="bar"><i style="width:${(S.i + (done?1:0))/n*100}%"></i></div>
      <div class="crumb">Question ${S.i+1} of ${n} ${done?"":"· <b id=\"tm\" class=\"timer\">"+fmt(S.endAt-Date.now())+"</b>"}</div><p class="q">${esc(q.q)}</p>` +
      q.o.map((o,k) => {
        let c = ""; if (done){ if (k===q.a) c="ok"; else if (k===S.picked) c="bad"; }
        return `<button class="opt ${c}" ${done?"disabled":""} onclick="answer(${k})">${esc(o)}</button>`;
      }).join("") +
      (done ? `<div class="exp"><b>${S.picked===q.a?"Correct!":"Not quite."}</b> ${esc(q.e||"")}</div>
        <button class="btn primary" onclick="next()">${S.i+1<n?"Next question":"See results"}</button>` : "");
  } else if (S.step === "result"){
    const n = S.qs.length, right = S.answers.filter((a,i)=>a===S.qs[i].a).length, pct = Math.round(right/n*100);
    const msg = pct>=80?"Excellent work!":pct>=50?"Good effort, keep practicing.":"Review the unit and try again.";
    h = backBtn() + `<div class="crumb">${esc(S.unit)}</div><div class="score">${right} / ${n}</div>
      <p class="center">${pct}% · ${msg}${S.timeUp?" · Time’s up!":""}</p>` +
      S.qs.map((q,i) => { const ok = S.answers[i]===q.a; return `<div class="rev"><div class="t">${i+1}. ${esc(q.q)}</div>
        <div class="tag" style="color:var(--${ok?"ok":"bad"})">${ok?"Correct":(S.answers[i]===undefined?"Not answered":"Your answer: "+esc(q.o[S.answers[i]]))}</div>
        ${ok?"":`<div>Right answer: ${esc(q.o[q.a])}</div>`}<div style="color:var(--muted)">${esc(q.e||"")}</div></div>`; }).join("") +
      `<div class="grid"><button class="btn primary" onclick="startQuiz(S.unitIdx)">Try again</button>
      <button class="btn primary" style="background:var(--card);color:var(--text);border:1px solid var(--line)" onclick="go('grade')">Choose another grade</button></div>`;
  }
  app.innerHTML = (S.step==="grade"?"":'<div class="mini">House of Wisdom</div>') + h;
  document.body.dataset.step = S.step;
}

function chooseGrade(g){ S.stream = null; S.grade = g; go(BANK[g].streams ? "stream" : "subject", {grade:g}); }
function chooseStream(i){ go("subject", {stream:Object.keys(BANK[S.grade].streams)[i]}); }
function chooseSubject(i){ go("unit", {subject:Object.keys(node().subjects)[i]}); }
function startQuiz(i){
  const units = node().subjects[S.subject], name = Object.keys(units)[i];
  S.unitIdx = i;
  const qs = buildQs(name, units[name]);
  S.qs = qs; S.i = 0;
  setDeadline();
  go("quiz", {unit:name, qs, i:0, picked:null, answers:[], timeUp:false});
  startTimer();
}
const setDeadline = () => { const q = S.qs[S.i]; S.endAt = Date.now() + ((q.c || /\d/.test(q.q)) ? 10 : 5) * 60000; }; // calculation question: 10 min, theory question: 5 min
let tick = null;
const fmt = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
function startTimer(){
  clearInterval(tick);
  tick = setInterval(() => {
    if (S.step !== "quiz") { clearInterval(tick); return; }
    if (S.picked !== null) return;
    const left = S.endAt - Date.now(), el = document.getElementById("tm");
    if (el) { el.textContent = fmt(left); if (left < 60000) el.style.color = "var(--bad)"; }
    if (left <= 0) next();
  }, 500);
}
function answer(k){ S.picked = k; S.answers[S.i] = k; render(); }
function next(){ if (S.i+1 < S.qs.length){ S.i++; S.picked = null; setDeadline(); go("quiz"); } else go("result"); }
render();
</script>
